name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:exports
      # Sends the package to npm for approval. A maintainer approves it on
      # npmjs.com (with 2FA) before it goes live. No tokens are stored here:
      # npm trusts this workflow through GitHub's OIDC identity.
      - run: npm stage publish
